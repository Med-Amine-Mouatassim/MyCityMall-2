<script type="module">
    
    import { auth, db } from '../mcm/firebase-config.js';
    import { doc, getDoc, updateDoc, arrayUnion, arrayRemove, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    let currentUser = null;

    // --- GESTION DE L'AUTHENTIFICATION ---
    // VÃ©rifie si un utilisateur est connectÃ© avant de charger les magasins
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        loadShops(); 
    });

    // On dÃ©finit le dÃ©lai minimum en millisecondes (ex: 800ms)
const MIN_LOADING_TIME = 800;
const startTime = Date.now();

window.addEventListener('load', function() {
    const currentTime = Date.now();
    const elapsedTime = currentTime - startTime;
    
    // On calcule s'il reste du temps Ã  attendre
    const remainingTime = Math.max(0, MIN_LOADING_TIME - elapsedTime);

    setTimeout(() => {
        const preloader = document.getElementById('preloader');
        preloader.classList.add('hidden'); // DÃ©clenche le fondu CSS
    }, remainingTime);
});

    // --- GESTION DES FAVORIS (LID AU COMPTE) ---
    window.toggleFavorite = async function(shopId, btn) {
        if (!currentUser) {
            alert("Vous devez être connecte pour ajouter des favoris !");
            window.location.href = '../mcm/login.html';
            return;
        }

        const userRef = doc(db, "utilisateurs", currentUser.uid);
        const isFav = btn.classList.contains('active');

        try {
            if (isFav) {
                // Supprimer du rayon des favoris dans Firestore
                await updateDoc(userRef, { favoris: arrayRemove(shopId) });
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fa-regular fa-heart"></i>';
            } else {
                // Ajouter au rayon des favoris dans Firestore
                await updateDoc(userRef, { favoris: arrayUnion(shopId) });
                btn.classList.add('active');
                btn.innerHTML = '<i class="fa-solid fa-heart"></i>';
            }
        } catch (error) {
            console.error("Erreur lors de la mise à jour des favoris :", error);
        }
    };

        function normalizeCategorie(value) {
        return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    async function fetchShops() {
        const shops = [];
        try {
            const q = query(collection(db, "magasins"), where("categorie", "==", "autres"));
            const snap = await getDocs(q);
            snap.forEach((docSnap) => {
                const data = docSnap.data();
                if (data) shops.push(data);
            });

            if (!shops.length) {
                const allSnap = await getDocs(collection(db, "magasins"));
                const target = "autres";
                allSnap.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (!data) return;
                    if (normalizeCategorie(data.categorie) === target) {
                        shops.push(data);
                    }
                });
            }
        } catch (e) {
            console.error("Erreur chargement magasins:", e);
        }

        if (!shops.length) {
            try {
                const res = await fetch('autres.json');
                const data = await res.json();
                data.forEach((shop) => shops.push(shop));
                console.warn("Fallback JSON utilisï¿½ pour autres.");
            } catch (e) {
                console.error("Erreur chargement JSON fallback:", e);
            }
        }

        return shops;
    }

    // --- CHARGEMENT DYNAMIQUE DES MAGASINS ---
    async function loadShops() {
        const list = document.getElementById('project-list');
        let userFavs = [];

       
    if (!list) return; // ðŸ›¡ï¸ sÃ©curitÃ©

 
        

        // RÃ©cupÃ©rer la liste des favoris depuis le compte utilisateur Firestore
        if (currentUser) {
            try {
                const userDoc = await getDoc(doc(db, "utilisateurs", currentUser.uid));
                if (userDoc.exists()) {
                    userFavs = userDoc.data().favoris || [];
                }
            } catch (error) {
                console.error("Erreur de récupération des favoris :", error);
            }
        }

        try {
            const data = await fetchShops();

            list.innerHTML = ""; // Nettoyer la liste avant affichage
            data.forEach(shop => {
                const isFav = userFavs.includes(shop.id_magasin);
                const card = document.createElement('div');
                card.className = 'project-card-container';
                card.innerHTML = `
                    <div class="project-card-inner">
                        <div class="btn-fav ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${shop.id_magasin}', this)">
                            <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
                        </div>

                        <div class="card-face card-front" style="background-image: url('${shop.image}')">
                            <h3>${shop.nom}</h3>
                            <div class="flip-hint">Details <i class="fa-solid fa-rotate"></i></div>
                        </div>
                        <div class="card-face card-back">
                            <h3>${shop.nom}</h3>
                            <p>${shop.description}</p>
                            <a href="../sport/catalogue.html?shop=${shop.id_magasin}" class="btn-visit">VOIR MAGASIN</a>
                        </div>
                    </div>`;
                list.appendChild(card);
                requestAnimationFrame(() => {
    card.classList.add('loaded');
});

            });
        } catch (error) {
            console.error("Erreur lors du chargement des magasins :", error);
        }
    }

    // --- INITIALISATION DES AUTRES FONCTIONS (RECHERCHE, ETC.) ---
    async function buildSearchData() {
        const data = [];

        const shops = await fetchShops();

        const shopIds = [];
        shops.forEach((shop) => {
            if (shop && shop.nom && shop.id_magasin) {
                data.push({
                    name: shop.nom,
                    type: "Magasin",
                    url: `../sport/catalogue.html?shop=${shop.id_magasin}`,
                    tags: [String(shop.id_magasin).toLowerCase()]
                });
                shopIds.push(shop.id_magasin);
            }
        });

        if (shopIds.length) {
            const seen = new Set();
            for (const shopId of shopIds) {
                try {
                    const q = query(
                        collection(db, "produits"),
                        where("id_magasin", "==", String(shopId).toLowerCase().trim())
                    );
                    const snapshot = await getDocs(q);
                    snapshot.forEach((docSnap) => {
                        const p = docSnap.data();
                        if (p && p.nom) {
                            const key = p.nom.toLowerCase();
                            if (!seen.has(key)) {
                                seen.add(key);
                                data.push({
                                    name: p.nom,
                                    type: "Produit",
                                    url: `../sport/catalogue.html?shop=${shopId}`,
                                    tags: Array.isArray(p.tags) ? p.tags.map(t => String(t).toLowerCase()) : []
                                });
                            }
                        }
                    });
                } catch (e) {
                    console.error("Erreur chargement produits:", e);
                }
            }
        }

        return data;
    }

    function scoreMatch(item, term) {
        const name = String(item.name || "").toLowerCase();
        if (name.startsWith(term)) return 3;
        if (name.includes(term)) return 2;
        if ((item.tags || []).some(t => t.includes(term))) return 1;
        return 0;
    }

    async function initSearch() {
        const searchInput = document.getElementById('main-search');
        const suggestionsBox = document.getElementById('search-suggestions');
        if (!searchInput || !suggestionsBox) return;

        const data = await buildSearchData();

        searchInput.addEventListener('input', (e) => {
            const value = e.target.value.toLowerCase().trim();
            if (!value) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = data
                .map(item => ({ item, score: scoreMatch(item, value) }))
                .filter(x => x.score > 0)
                .sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name))
                .slice(0, 5)
                .map(x => x.item);

            if (matches.length) {
                suggestionsBox.style.display = 'block';
                suggestionsBox.innerHTML = matches.map(match => `
                    <div class="suggestion-item" onclick="window.location.href='${match.url}'">
                        <span>
                            ${match.type === "Produit" ? '<i class="fa-solid fa-box"></i>' : match.type === "Magasin" ? '<i class="fa-solid fa-store"></i>' : '<i class="fa-solid fa-layer-group"></i>'}
                            ${match.name}
                        </span>
                        <span class="suggestion-type">${match.type}</span>
                    </div>
                `).join('');
            } else {
                suggestionsBox.style.display = 'none';
            }
        });
    }

    initSearch();    // Fermer les suggestions de recherche si on clique Ã  l'extÃ©rieur
