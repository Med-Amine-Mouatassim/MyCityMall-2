<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo - MyCityMall</title>
    <style>
        :root {
            --gold: #f5c542;
            --deep: #0f1116;
            --card: rgba(10, 12, 18, 0.72);
            --text: #f7f2e8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: #000;
        }

        .hero {
            min-height: 100vh;
            background: url('../mcm/photos/ramadan style.png') center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(0,0,0,0.7), rgba(0,0,0,0.35));
        }

        .card {
            position: relative;
            z-index: 2;
            width: min(720px, 92vw);
            background: var(--card);
            border: 1px solid rgba(245, 197, 66, 0.4);
            border-radius: 18px;
            padding: clamp(24px, 4vw, 40px);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            backdrop-filter: blur(4px);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(245, 197, 66, 0.7);
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(245, 197, 66, 0.7);
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s ease;
        }
        .back-btn:hover {
            background: var(--gold);
            color: #000;
        }
        h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 10px;
            color: var(--text);
        }

        .subtitle {
            font-size: clamp(1rem, 2.4vw, 1.3rem);
            color: #d8d0c2;
            margin-bottom: 18px;
        }

        .message {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: 700;
            color: var(--gold);
        }

        .sparkle {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #c7bfae;
        }

        @media (max-width: 520px) {
            .card { border-radius: 14px; }
        }
    </style>
</head>
<body>
    <main class="hero">
        <div class="overlay"></div>
        <a class="back-btn" href="../mcm/explorer.html"><- Retour</a>
        <section class="card">
            <div class="badge">Promotion</div>
            <h1>MyCityMall</h1>
            <p class="subtitle">Offres exclusives et surprises a venir</p>
            <div class="message">Bientot disponible</div>
            <div class="sparkle">Restez connectes pour decouvrir nos promotions</div>
        </section>
    </main>
</body>
</html>
